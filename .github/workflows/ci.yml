# CI on every pull request and push; production deploy from main only after CI passes.
#
# Security:
# - Least privilege: the token can only read the repository; no job can push, comment or change settings.
# - Actions are pinned to full commit SHAs (a moved tag cannot change what runs); Dependabot keeps them current.
# - Pull requests run with `pull_request` (never `pull_request_target`), so code from a fork never sees a secret.
# - The only secret, VERCEL_TOKEN, lives in the protected `production` environment and is used by the deploy job
#   on main alone. Database, mail and OAuth secrets stay in Vercel; the build there reads them, GitHub never does.
# - Checkouts keep no git credentials; installs use the exact lockfile; high or critical advisories fail the run.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24 # the version the Vercel project runs (Settings → Build and Deployment → Node.js Version)
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Verify (format, lint, types, tests, build, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fecpc
          POSTGRES_PASSWORD: fecpc_dev
          POSTGRES_DB: fecpc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fecpc" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://fecpc:fecpc_dev@localhost:5432/fecpc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (exact lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Test database
        run: psql "$DATABASE_URL" -c 'create database fecpc_test'

      - name: Format, lint, typecheck, test, build
        run: pnpm verify

      # The production build again, as Vercel runs it: the API inside the web app, a migrated and seeded database.
      - name: Smoke test the production build
        env:
          APP_ENV: ci # Secure __Host- cookie, like production
          VERCEL: '1' # serverless code paths (no timers; mail runs via /api/cron)
          APP_PUBLIC_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
        run: |
          export SEED_PASSWORD="$(openssl rand -hex 16)" CRON_SECRET="$(openssl rand -hex 32)"
          pnpm --filter @fecpc/api db:migrate
          pnpm --filter @fecpc/api db:seed
          pnpm --filter @fecpc/web start > web.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/login && break; sleep 1; done
          SMOKE_EMAIL=admin@fecpc.example SMOKE_PASSWORD="$SEED_PASSWORD" node scripts/smoke.mjs http://localhost:3000 \
            || { cat web.log; exit 1; }

  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_PUBLIC_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never stop a deploy halfway; the next one waits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Uploads the source; Vercel builds it with its own environment (vercel.json: migrate, build API, build web).
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Smoke test the live site
        run: node scripts/smoke.mjs "${{ vars.APP_PUBLIC_URL }}"
