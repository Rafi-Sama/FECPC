# Local development database: PostgreSQL 16 with the dev database (fecpc) and the test database (fecpc_test).
# Production reads DATABASE_URL from the host's secrets instead.
services:
  db:
    image: postgres:16-alpine
    container_name: fecpc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fecpc
      POSTGRES_PASSWORD: fecpc_dev
      POSTGRES_DB: fecpc
    ports: ['127.0.0.1:5433:5432']
    # Lets `docker compose up --wait` (pnpm dev) block until Postgres accepts connections.
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'fecpc', '-d', 'fecpc']
      interval: 2s
      retries: 15
    volumes:
      - fecpc_pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  fecpc_pg:
